name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 道具そのものの単体テスト
        run: node --test tools/*.test.mjs
      # ⚠️ 組み立てる 道具は --check だけを 呼ぶ。build を 先に 走らせると
      #    生成物を 上書きして しまい、ずれが 素通りする（2026-08-28 の 教訓）。
      - name: data/animals.js が content/ と そろっているか
        run: node tools/build-animals.mjs --check
      - name: SW の版が中身と一致しているか
        run: node tools/build-sw.mjs --check
      - name: データの形と文の型・写真のライセンス
        run: node tools/check-data.mjs
      - name: 外から読み込んでいないか（Zero-CDN）
        run: node tools/check-no-external.mjs
      - name: ページの中のリンクが切れていないか
        run: node tools/check-links.mjs
      - name: 写真の出どころページが データと合っているか
        run: node tools/build-credits.mjs --check

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
