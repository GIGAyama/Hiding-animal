name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 道具そのものの単体テスト
        run: node --test tools/check-data.test.mjs tools/check-no-external.test.mjs
      - name: SW の版が中身と一致しているか
        run: node tools/build-sw.mjs --check
      - name: データの形と文の型・写真のライセンス
        run: node tools/check-data.mjs
      - name: 外から読み込んでいないか（Zero-CDN）
        run: node tools/check-no-external.mjs
      - name: 写真の出どころページが データと合っているか
        run: node tools/build-credits.mjs --check

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
